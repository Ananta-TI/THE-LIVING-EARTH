# Supabase project configuration for THE LIVING EARTH
# Reference: https://supabase.com/docs/guides/cli/config

project_id = "the-living-earth"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = false

[storage]
enabled = true
file_size_limit = "5MiB"
